<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>生死轮</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Jost:wght@300;400;500&family=Noto+Serif+SC:wght@400;600&family=Noto+Sans+SC:wght@300;400;500&display=swap">
<style>
/* Layout: one full-bleed canvas (the bhavacakra) with a thin inscription-style HUD floating at the corners */
:root{
  color-scheme: dark;
  --night:#06050c;
  --ink:#f3e9d2;
  --dim:rgba(243,233,210,.62);
  --faint:rgba(243,233,210,.16);
  --gold:#e8b84a;
  --lotus:#ff8fb1;
  --acc:#ff7043;
  --display:"Noto Serif SC","Songti SC","STSong","SimSun","Marcellus","Trajan Pro","Palatino Linotype",Georgia,serif;
  --ui:"Noto Sans SC","PingFang SC","Microsoft YaHei","Jost","Avenir Next","Segoe UI",system-ui,sans-serif;
}
html,body{height:100%;overflow:hidden;background:var(--night);color:var(--ink);font-family:var(--ui);-webkit-user-select:none;user-select:none;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
.label{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}

#hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 16px);left:max(16px,env(safe-area-inset-left,0px));display:grid;gap:10px;pointer-events:none;max-width:min(320px,58vw)}
.realm{display:flex;align-items:baseline;gap:12px}
#rnum{font-family:var(--display);font-size:28px;color:var(--acc);min-width:1.6em;transition:color 1s}
#rname{font-family:var(--display);font-size:22px;line-height:1.1}
#reng{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.meter{height:3px;background:var(--faint);border-radius:2px;overflow:hidden;width:min(240px,52vw)}
#mfill{display:block;height:100%;width:0;background:var(--acc);box-shadow:0 0 12px var(--acc);transition:width .3s,background 1s}
.row{display:flex;align-items:center;gap:14px}
#mala{display:flex;gap:6px}
#mala span{width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold);transition:all .4s}
#mala span.lost{background:transparent;box-shadow:inset 0 0 0 1px var(--faint)}
#path{display:flex;gap:5px;align-items:center}
#path i{width:5px;height:5px;border-radius:50%;background:var(--faint);transition:background .6s}
#path i.on{background:var(--ink)}
#path i.here{background:var(--acc);box-shadow:0 0 6px var(--acc)}
#path b{font-weight:400;font-size:11px;color:var(--dim);margin-left:2px}

#hudr{position:fixed;top:calc(env(safe-area-inset-top,0px) + 16px);right:max(16px,env(safe-area-inset-right,0px));display:grid;justify-items:end;gap:6px}
#score{font-family:var(--display);font-size:28px;font-variant-numeric:tabular-nums;line-height:1}
#meta{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);text-align:right;line-height:1.6}
.btn{font:500 11px/1 var(--ui);letter-spacing:.16em;text-transform:uppercase;color:var(--ink);background:rgba(6,5,12,.45);border:1px solid var(--faint);border-radius:999px;padding:9px 14px;cursor:pointer;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.btn:hover{border-color:var(--dim)}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#snd[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}

#demo{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 18px);font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--dim);border:1px solid var(--faint);padding:5px 10px 5px 13px;border-radius:999px;pointer-events:none}

#title{position:fixed;left:0;right:0;bottom:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:90px calc(env(safe-area-inset-bottom,0px) + 26px);background:linear-gradient(to bottom,transparent,rgba(4,3,8,.82) 55%);display:grid;justify-items:center;text-align:center;gap:12px;pointer-events:none;transition:opacity .8s}
#title h1{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(34px,6.4vw,72px);letter-spacing:.06em;line-height:1;text-wrap:balance;background:linear-gradient(180deg,#fff6dc,#e8b84a 80%);-webkit-background-clip:text;background-clip:text;color:transparent}
#title .sub{font-size:12px;letter-spacing:.42em;text-transform:uppercase;color:var(--dim)}
#title blockquote{margin:4px 0 0;max-width:46ch;font-family:var(--display);font-size:clamp(14px,1.6vw,17px);line-height:1.5;color:var(--ink);text-wrap:balance}
#title cite{display:block;margin-top:4px;font:400 11px var(--ui);letter-spacing:.16em;text-transform:uppercase;color:var(--dim);font-style:normal}
.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 22px;margin-top:6px;font-size:12.5px;color:var(--dim)}
.legend span{display:inline-flex;align-items:center;gap:8px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.cta{margin-top:8px;font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--ink);animation:pulse 2.4s ease-in-out infinite}
.keys{font-size:12px;color:var(--dim);max-width:60ch}
kbd{font:500 11px var(--ui);border:1px solid var(--faint);border-radius:4px;padding:1px 6px;color:var(--ink)}
@keyframes pulse{50%{opacity:.35}}
#title>*{transition:opacity .9s,max-height .9s;max-height:400px}
#title.mini{background:linear-gradient(to bottom,transparent,rgba(4,3,8,.5) 60%);padding-block:40px calc(env(safe-area-inset-bottom,0px) + 22px)}
#title.mini>*:not(.cta){opacity:0;max-height:0;overflow:hidden;margin:0}

#banner{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100vw - 32px));text-align:center;pointer-events:none;opacity:0;display:grid;gap:8px;text-shadow:0 2px 18px rgba(0,0,0,.9)}
#banner.show{animation:banner 4.6s ease forwards}
#bTop{font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--acc)}
#bTitle{font-family:var(--display);font-size:clamp(36px,7vw,64px);line-height:1}
#bSub{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
#bQuote{font-family:var(--display);font-size:clamp(14px,2vw,18px);line-height:1.5;margin-top:8px;text-wrap:balance}
#bCite{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
@keyframes banner{0%{opacity:0;transform:translate(-50%,-44%)}12%{opacity:1;transform:translate(-50%,-50%)}78%{opacity:1}100%{opacity:0;transform:translate(-50%,-54%)}}

#breathe{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 22px);padding:14px 26px;font-size:12px}
#breathe.cool{opacity:.4}

@media (max-width:520px){
  #rname{font-size:18px}#rnum{font-size:22px}#score{font-size:22px}
  #demo{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 8px)}
  .legend{font-size:11.5px;gap:6px 14px}
  #title{padding-block:60px calc(env(safe-area-inset-bottom,0px) + 34px)}
}
@media (prefers-reduced-motion:reduce){.cta{animation:none}#banner.show{animation-duration:4.6s}}
</style>
</head>
<body>

<canvas id="c" aria-label="生死轮游戏"></canvas>

<div id="hud">
  <div class="realm"><span id="rnum">一</span><div><div id="rname">地狱道</div><div id="reng">Naraka · 地狱</div></div></div>
  <div class="meter" title="每 30 秒升入下一道"><i id="mfill"></i></div>
  <div class="row"><div id="mala" title="念珠：被击中三次即堕入下一道"><span></span><span></span><span></span></div><div id="path"></div></div>
</div>

<div id="hudr">
  <div id="score">0</div>
  <div id="meta">功德 · 第 1 轮<br>最高 0</div>
  <button class="btn" id="snd" aria-pressed="false">声音 关</button>
</div>

<div id="demo">演示</div>

<div id="title">
  <div class="sub">六道轮回 · 唵嘛呢叭咪吽</div>
  <h1>生死轮</h1>
  <blockquote>无火如贪欲，无执如嗔恚，无网如愚痴，无河如爱欲。<cite>《法句经》第二五一偈</cite></blockquote>
  <div class="legend">
    <span><i style="background:#ff8fb1;box-shadow:0 0 8px #ff8fb1"></i>莲花 · 积累功德</span>
    <span><i style="background:#ff4b3e"></i>贪 · 贪欲</span>
    <span><i style="background:#3fdc84"></i>嗔 · 嗔恚</span>
    <span><i style="background:#2a2245;box-shadow:inset 0 0 0 1.5px #9d8cf0"></i>痴 · 愚痴</span>
    <span><i style="background:#e8b84a"></i>法轮 · 清除三毒</span>
  </div>
  <div class="keys">用 <kbd>←</kbd> <kbd>→</kbd>、鼠标或手指绕轮而行。按 <kbd>空格</kbd> 调息：放出一圈正念，化解三毒。历经六道，证入涅槃。</div>
  <div class="cta">点击或按任意键开始</div>
</div>

<div id="banner"><div id="bTop"></div><div id="bTitle"></div><div id="bSub"></div><div id="bQuote"></div><div id="bCite"></div></div>

<button class="btn" id="breathe" hidden>调息</button>

<script>
(()=>{
const TAU=Math.PI*2, PI=Math.PI;
const $=id=>document.getElementById(id);
const cv=$('c'), ctx=cv.getContext('2d');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const angDiff=(a,b)=>{let d=(a-b)%TAU;if(d>PI)d-=TAU;if(d<-PI)d+=TAU;return d};
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rnd=(a,b)=>a+Math.random()*(b-a);
const ease=p=>1-Math.pow(1-p,3);
const ROMAN=['一','二','三','四','五','六'];document.documentElement.lang='zh-CN';

/* Six realms, in ascending order. Background tints follow the traditional
   colours of the realms in Tibetan paintings: smoke, red, blue, green, yellow, white. */
const REALMS=[
 {n:'地狱道', e:'Naraka · 地狱', bg:[[38,26,22],[7,4,4]], acc:[255,112,67],
  q:'诸法意先导，意主意造作。', c:'《法句经》第一偈'},
 {n:'饿鬼道', e:'Preta · 饿鬼', bg:[[58,10,26],[11,2,6]], acc:[255,96,128],
  q:'无病最上利，知足最上财。', c:'《法句经》第二〇四偈'},
 {n:'畜生道', e:'Tiryak · 畜生', bg:[[8,30,66],[2,5,15]], acc:[100,180,255],
  q:'于此世界中，从非怨止怨，唯以忍止怨，此古圣常法。', c:'《法句经》第五偈'},
 {n:'阿修罗道', e:'Asura · 阿修罗', bg:[[6,48,36],[1,9,7]], acc:[84,232,168],
  q:'虽于战场胜百万人，不如克己，战士最上。', c:'《法句经》第一〇三偈'},
 {n:'人道', e:'Manuṣya · 人间', bg:[[52,38,8],[9,7,2]], acc:[255,211,110],
  q:'得生人道难，生得寿终难。', c:'《法句经》第一八二偈'},
 {n:'天道', e:'Deva · 天人', bg:[[44,38,78],[9,7,22]], acc:[242,234,255],
  q:'一切行无常。', c:'《法句经》第二七七偈'},
];
const NIRV={bg:[[70,50,18],[14,9,3]], acc:[255,232,170]};

let W,H,DPR,cx,cy,S,ringR,objR,P_R,spawnR;
const SP={};
let layerA,layerB;

function mk(size,fn,dpr=DPR){const c=document.createElement('canvas');c.width=c.height=Math.max(2,Math.ceil(size*dpr));const g=c.getContext('2d');g.scale(dpr,dpr);g.translate(size/2,size/2);fn(g,size);c._s=size;return c}
function glow(g,r,rgb,a){const gr=g.createRadialGradient(0,0,0,0,0,r);gr.addColorStop(0,`rgba(${rgb},${a})`);gr.addColorStop(.4,`rgba(${rgb},${a*.35})`);gr.addColorStop(1,`rgba(${rgb},0)`);g.fillStyle=gr;g.beginPath();g.arc(0,0,r,0,TAU);g.fill()}
function petals(g,n,len,wid,c1,c2,off){for(let i=0;i<n;i++){g.save();g.rotate(off+i*TAU/n);const gr=g.createLinearGradient(0,0,0,-len);gr.addColorStop(0,c2);gr.addColorStop(1,c1);g.fillStyle=gr;g.beginPath();g.moveTo(0,0);g.bezierCurveTo(wid,-len*.25,wid*.8,-len*.8,0,-len);g.bezierCurveTo(-wid*.8,-len*.8,-wid,-len*.25,0,0);g.fill();g.restore()}}
function starPath(g,n,ro,ri,jit=0){g.beginPath();for(let i=0;i<n*2;i++){const r=(i%2?ri:ro)*(1+(i%2?0:(Math.sin(i*12.9898)*jit)));const a=i*PI/n;g.lineTo(Math.cos(a)*r,Math.sin(a)*r)}g.closePath()}

function buildSprites(){
  const R=objR;
  SP.lotus=mk(R*4.4,g=>{glow(g,R*2.2,'255,143,177',.5);petals(g,8,R*1.1,R*.5,'#ff7aa6','#ffd6e3',0);petals(g,8,R*.78,R*.4,'#ffc2d6','#fff3f7',PI/8);g.fillStyle='#ffd36e';g.beginPath();g.arc(0,0,R*.2,0,TAU);g.fill()});
  SP.greed=mk(R*4.4,g=>{glow(g,R*2.2,'255,70,50',.55);starPath(g,11,R*1.05,R*.5,.12);const gr=g.createRadialGradient(0,0,0,0,0,R);gr.addColorStop(0,'#ff8a5c');gr.addColorStop(1,'#7a0f0a');g.fillStyle=gr;g.fill();g.lineWidth=1.5;g.strokeStyle='#ffb199';g.stroke();g.fillStyle='#2a0503';g.beginPath();g.arc(0,0,R*.28,0,TAU);g.fill()});
  SP.hate=mk(R*4.4,g=>{glow(g,R*2.2,'60,230,130',.5);starPath(g,7,R*1.15,R*.38,.25);const gr=g.createRadialGradient(0,0,0,0,0,R);gr.addColorStop(0,'#8dffb8');gr.addColorStop(1,'#0a3d22');g.fillStyle=gr;g.fill();g.lineWidth=1.5;g.strokeStyle='#b6ffd2';g.stroke();g.strokeStyle='#04170c';g.lineWidth=R*.12;g.beginPath();g.moveTo(-R*.3,-R*.1);g.lineTo(R*.3,R*.1);g.stroke()});
  SP.delu=mk(R*4.4,g=>{glow(g,R*2.2,'130,100,230',.45);for(let i=0;i<6;i++){const a=i*TAU/6;g.fillStyle='rgba(30,22,58,.9)';g.beginPath();g.arc(Math.cos(a)*R*.45,Math.sin(a)*R*.45,R*.5,0,TAU);g.fill()}g.fillStyle='#120d24';g.beginPath();g.arc(0,0,R*.62,0,TAU);g.fill();g.strokeStyle='#a796ff';g.lineWidth=1.6;g.beginPath();for(let t=0;t<14;t+=.2){const r=R*.05+t*R*.055;g.lineTo(Math.cos(t)*r,Math.sin(t)*r)}g.stroke()});
  SP.wheel=mk(R*5,g=>{glow(g,R*2.5,'255,205,90',.6);g.strokeStyle='#ffd77a';g.fillStyle='#ffd77a';g.lineWidth=R*.14;g.beginPath();g.arc(0,0,R*.95,0,TAU);g.stroke();for(let i=0;i<8;i++){const a=i*TAU/8;g.beginPath();g.moveTo(Math.cos(a)*R*.2,Math.sin(a)*R*.2);g.lineTo(Math.cos(a)*R*.95,Math.sin(a)*R*.95);g.lineWidth=R*.1;g.stroke();g.beginPath();g.arc(Math.cos(a)*R*1.15,Math.sin(a)*R*1.15,R*.13,0,TAU);g.fill()}g.beginPath();g.arc(0,0,R*.26,0,TAU);g.fill()});
  SP.glowGold=mk(P_R*9,g=>glow(g,P_R*4.5,'255,200,110',.7));
  SP.bigLotus=mk(ringR*2.4,g=>{glow(g,ringR*1.2,'255,220,170',.5);petals(g,12,ringR*.95,ringR*.34,'rgba(255,150,190,.9)','rgba(255,240,245,.95)',0);petals(g,12,ringR*.7,ringR*.28,'rgba(255,200,220,.95)','#fff',PI/12);petals(g,8,ringR*.42,ringR*.2,'#ffe7a8','#fff',0);g.fillStyle='#ffd36e';g.beginPath();g.arc(0,0,ringR*.1,0,TAU);g.fill()});
}

function buildLayers(acc){
  const col=`rgb(${acc.map(v=>Math.round(v)).join(',')})`;
  // Layer A: mantra inscribed around the track
  const rA=ringR*1.3, fs=Math.max(10,ringR*.072);
  layerA=mk(rA*2+fs*4,g=>{
    g.fillStyle=col;g.strokeStyle=col;g.font=`${fs}px "Noto Serif SC", "Songti SC", SimSun, serif`;g.textAlign='center';g.textBaseline='middle';
    const unit='唵 嘛 呢 叭 咪 吽 　·　 ';
    const circ=TAU*rA;let chars=[];let total=0;
    while(total<circ){for(const ch of unit){const w=g.measureText(ch).width;chars.push([ch,w]);total+=w}}
    while(total>circ&&chars.length){total-=chars.pop()[1]}
    const k=circ/total;let a=0;
    for(const[ch,w]of chars){const mid=a+(w*k/2)/rA;g.save();g.rotate(mid);g.translate(0,-rA);g.fillText(ch,0,0);g.restore();a+=w*k/rA}
    g.lineWidth=1;g.globalAlpha=.6;g.beginPath();g.arc(0,0,rA-fs*.95,0,TAU);g.stroke();g.beginPath();g.arc(0,0,rA+fs*.95,0,TAU);g.stroke();
  },1);
  // Layer B: outer lotus mandala
  const rB=ringR*1.75;
  layerB=mk(rB*2.3,g=>{
    g.strokeStyle=col;g.lineWidth=1;
    for(let ring=0;ring<2;ring++){const n=ring?24:16,len=ring?ringR*.3:ringR*.42,base=ring?rB:rB*.8;
      for(let i=0;i<n;i++){g.save();g.rotate(i*TAU/n+(ring?PI/24:0));g.translate(0,-base+len*.5);g.beginPath();g.moveTo(0,len*.5);g.bezierCurveTo(len*.4,len*.2,len*.25,-len*.35,0,-len*.5);g.bezierCurveTo(-len*.25,-len*.35,-len*.4,len*.2,0,len*.5);g.stroke();g.restore()}}
    g.beginPath();g.arc(0,0,rB*1.12,0,TAU);g.stroke();
    for(let i=0;i<72;i++){const a=i*TAU/72;g.beginPath();g.moveTo(Math.cos(a)*rB*1.12,Math.sin(a)*rB*1.12);g.lineTo(Math.cos(a)*rB*(i%6?1.14:1.18),Math.sin(a)*rB*(i%6?1.14:1.18));g.stroke()}
  },1);
  layerAcc=acc.slice();
}
let layerAcc=null;

let stars=[];
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  cx=W/2;cy=H/2+(W<560?-H*.03:0);S=Math.min(W,H);
  ringR=S*(W<560?.36:.32);objR=Math.max(11,S*.026);P_R=objR*.85;
  spawnR=Math.hypot(W,H)/2+objR*3;
  buildSprites();buildLayers(cur.acc);
  stars=[];const n=Math.round(W*H/5000);for(let i=0;i<n;i++)stars.push({a:Math.random()*TAU,r:Math.sqrt(Math.random())*spawnR,s:Math.random()*1.4+.3,tw:Math.random()*TAU,sp:rnd(.5,2)});
}

/* ---------------- state ---------------- */
const cur={bg:REALMS[0].bg.map(c=>c.slice()),acc:REALMS[0].acc.slice()};
let best=0;try{best=+localStorage.getItem('wob-best')||0}catch(e){}
const REALM_T=30, BREATH_DUR=.7, BREATH_CD=4.5, NIRV_DUR=8, MAXW=2.9;
let G;
function newGame(mode){
  G={mode,realm:0,merit:0,beads:3,cycle:0,score:0,shown:0,objs:[],parts:[],ripples:[],pa:-PI/2,pv:0,target:null,keyDir:0,
     breath:0,breathCd:0,spawnT:.6,t:0,shake:0,flash:0,flashRGB:'255,255,255',nirvana:0,idle:0,picks:0,flameScale:1,aiT:0,realmT:0};
  updateHUD();
}

/* ---------------- audio ---------------- */
const Snd={ac:null,on:false,
  init(){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;try{this.ac=new AC()}catch(e){return false}const ac=this.ac;
    this.master=ac.createGain();this.master.gain.value=0;this.master.connect(ac.destination);
    const conv=ac.createConvolver();conv.buffer=this.impulse(4.5);const wet=ac.createGain();wet.gain.value=.55;const dry=ac.createGain();dry.gain.value=.75;
    this.bus=ac.createGain();this.bus.connect(dry);this.bus.connect(conv);conv.connect(wet);dry.connect(this.master);wet.connect(this.master);
    const dg=ac.createGain();dg.gain.value=.06;const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=520;dg.connect(lp);lp.connect(this.bus);

/* ---------------- game logic ---------------- */
function spawn(){
  const r=Math.random();let kind;
  const lotusP=G.mode==='demo'?.5:.46;
  if(r<.03)kind='wheel';else if(r<.03+lotusP)kind='lotus';else kind=['greed','hate','delu'][Math.floor(Math.random()*3)];
  const a=Math.random()<.35?G.pa+rnd(-.7,.7):Math.random()*TAU;
  const travel=Math.max(1.7,3.8-G.realm*.22-G.cycle*.25)*rnd(.85,1.25);
  G.objs.push({kind,a,r:spawnR,v:(spawnR-ringR)/travel,w:rnd(-.25,.25),rad:objR,rot:Math.random()*TAU,spin:rnd(-1.5,1.5),dead:false,born:G.t});
}
function burst(x,y,rgb,n,spd,size=2){for(let i=0;i<n;i++){const a=Math.random()*TAU,s=rnd(.2,1)*spd;G.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rnd(.5,1.1),max:1.1,size:rnd(.6,1.4)*size,rgb})}}
function ripple(rgb,max=ringR*2.2,w=2){G.ripples.push({r:ringR*.2,max,life:1,rgb,w})}
function playerPos(){return[cx+Math.cos(G.pa)*ringR,cy+Math.sin(G.pa)*ringR]}

function collect(o){
  const[x,y]=[o.x,o.y];
  if(o.kind==='lotus'){
    G.merit+=G.mode==='demo'?10:8;G.score+=10*(G.realm+1)*(G.cycle+1);burst(x,y,'255,170,200',18,S*.25);burst(x,y,'255,215,120',8,S*.15,1.5);
    Snd.bowl(PENTA[G.picks%PENTA.length]*(G.realm>=3?1:.5),.14,3.2);G.picks++;
  }else{
    G.merit+=15;G.score+=50*(G.realm+1);burst(x,y,'255,210,110',40,S*.4,2.4);ripple('255,210,110',ringR*2.6,3);
    for(const p of G.objs)if(!p.dead&&p.kind!=='lotus'&&p.kind!=='wheel'){p.dead=true;burst(p.x,p.y,'255,230,170',10,S*.2)}
    Snd.bowl(130.81,.3,7);Snd.bowl(196,.18,6);
  }
}
function hit(o){
  const col=o.kind==='greed'?'255,80,60':o.kind==='hate'?'70,230,140':'150,120,255';
  burst(o.x,o.y,col,26,S*.32,2.2);G.shake=reduce?0:14;G.flash=.5;G.flashRGB=col;
  G.beads--;G.merit=Math.max(0,G.merit-15);Snd.thud();
  if(G.beads<=0)fall();
}
function ascend(){
  if(G.realm>=5){startNirvana();return}
  G.realm++;G.merit=0;G.beads=3;
  const R=REALMS[G.realm];ripple(R.acc.join(','),ringR*3,3);ripple('255,255,255',ringR*2,1);
  banner('往生上道',R.n,R.e,R.q,R.c);
  Snd.bowl(261.63,.22,6);setTimeout(()=>Snd.bowl(392,.16,6),180);setTimeout(()=>Snd.bowl(523.25,.12,6),360);
}
function fall(){
  G.beads=3;G.score=Math.max(0,G.score-50*(G.realm+1));
  const R=REALMS[G.realm];
  banner('念珠散落','重新持念','功德有损，继续前行',R.q,R.c);
  Snd.whoosh();
}
function startNirvana(){
  G.nirvana=NIRV_DUR;G.merit=100;G.flash=1;G.flashRGB='255,240,210';
  for(const o of G.objs){if(!o.dead){o.dead=true;burst(o.x,o.y,'255,235,190',8,S*.2)}}
  banner('超越六道','涅槃','灯尽火灭，寂静安乐','涅槃最上乐。','《法句经》第二〇三偈');
  Snd.bowl(130.81,.3,9);setTimeout(()=>Snd.bowl(196,.22,9),400);setTimeout(()=>Snd.bowl(261.63,.18,9),800);setTimeout(()=>Snd.bowl(392,.14,9),1200);
  for(let i=0;i<4;i++)setTimeout(()=>G&&ripple('255,230,170',ringR*3.5,2),i*500);
}
function endNirvana(){
  G.cycle++;G.realm=0;G.merit=0;G.beads=3;G.realmT=0;G.objs=[];G.flameScale=0;
  const R=REALMS[0];banner(`第 ${G.cycle+1} 轮`,'又一盏灯点亮','法轮再转',R.q,R.c);

function breathe(){
  if(G.breathCd>0||G.nirvana>0)return;G.breath=BREATH_DUR;G.breathCd=BREATH_CD;Snd.whoosh();
}

/* demo pilot: samples the ring and scores each heading by lotuses it can reach
   minus poisons it would sit under when they cross the track */
function aiThink(){
  const N=56;let bestS=-1e9,bestA=G.pa;let danger=false;const[px,py]=playerPos();
  for(let i=0;i<N;i++){
    const off=-PI+(i+.5)*TAU/N,a=G.pa+off,reach=Math.abs(off)/MAXW;
    let s=-Math.abs(off)*.25;
    for(const o of G.objs){if(o.dead)continue;const t=(o.r-ringR)/o.v;if(t<-.15||t>3)continue;const tt=Math.max(t,0);
      const oa=o.a+o.w*tt,hitR=o.rad*.8+P_R;
      if(o.kind==='lotus'||o.kind==='wheel'){if(reach<tt+.05){const d=Math.abs(angDiff(oa,a))*ringR;s+=(o.kind==='wheel'?3:1.1)*Math.exp(-(d*d)/(hitR*hitR*2))/(t+.6)}}
      else{const ourA=G.pa+Math.sign(off)*Math.min(Math.abs(off),MAXW*tt);const d1=Math.abs(angDiff(oa,ourA))*ringR,d2=Math.abs(angDiff(oa,a))*ringR;const dd=Math.min(d1,d2*1.3);s-=5*Math.exp(-(dd*dd)/(hitR*hitR*1.6))/(t+.25)}}
    if(s>bestS){bestS=s;bestA=a}
  }
  for(const o of G.objs){if(o.dead||o.kind==='lotus'||o.kind==='wheel')continue;if(Math.hypot(o.x-px,o.y-py)<(o.rad+P_R)*1.9)danger=true}
  G.target=bestA;if(danger&&Math.random()<.6)breathe();
}

function update(dt){
  G.t+=dt;
  // palette drift toward current realm
  const tgt=G.nirvana>0?NIRV:REALMS[G.realm];const k=Math.min(1,dt*1.6);
  for(let i=0;i<2;i++)for(let j=0;j<3;j++)cur.bg[i][j]+=(tgt.bg[i][j]-cur.bg[i][j])*k;
  let accMoved=0;for(let j=0;j<3;j++){const d=(tgt.acc[j]-cur.acc[j])*k;cur.acc[j]+=d;accMoved+=Math.abs(tgt.acc[j]-cur.acc[j])}
  if(layerAcc&&Math.abs(layerAcc[0]-cur.acc[0])+Math.abs(layerAcc[1]-cur.acc[1])+Math.abs(layerAcc[2]-cur.acc[2])>18||(accMoved<1&&layerAcc&&layerAcc.some((v,j)=>Math.abs(v-tgt.acc[j])>1))){buildLayers(cur.acc.map(Math.round))}
  setAccentCSS(cur.acc.map(Math.round));

  if(G.nirvana>0){G.nirvana-=dt;if(G.nirvana<=0){G.nirvana=0;endNirvana()}}
  else{G.realmT+=dt;if(G.realmT>=REALM_T){G.realmT=0;ascend()}}
  G.flameScale=Math.min(1,G.flameScale+dt*.8);

  // steering
  if(G.mode==='demo'){G.aiT-=dt;if(G.aiT<=0){aiThink();G.aiT=.05}$('title').classList.toggle('mini',G.t%32>9)}
  else{G.idle+=dt;if(G.idle>30){toDemo();return}}
  let desired=0;
  if(G.keyDir)desired=G.keyDir*MAXW;else if(G.target!=null)desired=clamp(angDiff(G.target,G.pa)*7,-MAXW,MAXW);
  G.pv+=(desired-G.pv)*Math.min(1,dt*12);G.pa+=G.pv*dt;
  if(G.breath>0)G.breath-=dt;if(G.breathCd>0)G.breathCd-=dt;
  $('breathe').classList.toggle('cool',G.breathCd>0);

  if(G.nirvana<=0){G.spawnT-=dt;if(G.spawnT<=0){spawn();G.spawnT=Math.max(.26,.82-G.realm*.07-G.cycle*.06)*rnd(.7,1.3)}}

  const[px,py]=playerPos();
  const bR=G.breath>0?P_R+(objR*5.5-P_R)*ease(1-G.breath/BREATH_DUR):0;
  for(const o of G.objs){
    o.r-=o.v*dt;o.a+=o.w*dt;o.rot+=o.spin*dt;o.x=cx+Math.cos(o.a)*o.r;o.y=cy+Math.sin(o.a)*o.r;
    if(o.dead)continue;
    const d=Math.hypot(o.x-px,o.y-py);
    const poison=o.kind!=='lotus'&&o.kind!=='wheel';
    if(poison&&bR&&d<bR+o.rad*.6){o.dead=true;burst(o.x,o.y,'255,240,210',14,S*.22);G.merit=Math.min(99.9,G.merit+2);G.score+=5;continue}
    if(d<o.rad*.8+P_R&&G.flameScale>.6){o.dead=true;poison?hit(o):collect(o)}
  }
  G.objs=G.objs.filter(o=>!o.dead&&o.r>ringR*.12);

  // flame trail
  if(G.flameScale>.3)G.parts.push({x:px+rnd(-2,2),y:py+rnd(-2,2),vx:Math.cos(G.pa)*S*.03+rnd(-6,6),vy:Math.sin(G.pa)*S*.03+rnd(-6,6),life:.6,max:.6,size:P_R*.35,rgb:'255,190,100'});
  for(const p of G.parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.96;p.vy*=.96;p.life-=dt}
  G.parts=G.parts.filter(p=>p.life>0);if(G.parts.length>900)G.parts.splice(0,G.parts.length-900);
  for(const r of G.ripples){r.life-=dt*.55;r.r+=(r.max-r.r)*dt*1.4}
  G.ripples=G.ripples.filter(r=>r.life>0);
  G.shake*=Math.pow(.02,dt);G.flash=Math.max(0,G.flash-dt*1.2);
  G.shown+=(G.score-G.shown)*Math.min(1,dt*8);
  hudTick();
}
let lastHud='';
function hudTick(){
  const key=[G.realm,Math.floor(G.realmT*2),G.beads,G.cycle,G.nirvana>0,G.mode].join();
  if(key!==lastHud){lastHud=key;updateHUD()}
  $('score').textContent=Math.round(G.shown).toLocaleString();
  if(G.mode==='play'&&G.score>best){best=G.score;try{localStorage.setItem('wob-best',best)}catch(e){}}
}

/* ---------------- render ---------------- */
const rgb=a=>`${a[0]|0},${a[1]|0},${a[2]|0}`;
function sprite(c,x,y,rot,scale,alpha){ctx.save();ctx.globalAlpha=alpha;ctx.translate(x,y);if(rot)ctx.rotate(rot);const s=c._s*scale;ctx.drawImage(c,-s/2,-s/2,s,s);ctx.restore()}
function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const g=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.hypot(W,H)*.6);
  g.addColorStop(0,`rgb(${rgb(cur.bg[0])})`);g.addColorStop(1,`rgb(${rgb(cur.bg[1])})`);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const acc=rgb(cur.acc);const t=G.t;const slow=reduce?.3:1;
  if(G.shake>.3){ctx.translate(rnd(-1,1)*G.shake,rnd(-1,1)*G.shake)}

  // stars, slowly orbiting the wheel
  ctx.fillStyle='#fff';
  for(const s of stars){const a=s.a+t*.012*slow;const x=cx+Math.cos(a)*s.r,y=cy+Math.sin(a)*s.r;if(x<-2||y<-2||x>W+2||y>H+2)continue;ctx.globalAlpha=(.35+.35*Math.sin(t*s.sp+s.tw))*.8;ctx.fillRect(x,y,s.s,s.s)}
  ctx.globalAlpha=1;

  // mandala layers
  ctx.globalCompositeOperation='lighter';
  sprite(layerB,cx,cy,t*.03*slow,1,.13);
  sprite(layerA,cx,cy,-t*.06*slow,1,.32);
  ctx.globalCompositeOperation='source-over';

  // track
  const breathPulse=1+.04*Math.sin(t*.8);
  ctx.strokeStyle=`rgba(${acc},.10)`;ctx.lineWidth=objR*1.9;ctx.beginPath();ctx.arc(cx,cy,ringR,0,TAU);ctx.stroke();
  ctx.strokeStyle=`rgba(${acc},.55)`;ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(cx,cy,ringR,0,TAU);ctx.stroke();
  for(let i=0;i<108;i++){const a=i*TAU/108+t*.02*slow;const r1=ringR+objR*(i%9?1.1:1.4);ctx.globalAlpha=i%9?.25:.6;ctx.beginPath();ctx.moveTo(cx+Math.cos(a)*(ringR+objR*.95),cy+Math.sin(a)*(ringR+objR*.95));ctx.lineTo(cx+Math.cos(a)*r1,cy+Math.sin(a)*r1);ctx.stroke()}
  ctx.globalAlpha=1;

  drawHub(acc,t,breathPulse,slow);

  // falling things
  for(const o of G.objs){
    const fadeIn=Math.min(1,(G.t-o.born)*2),fadeOut=clamp((o.r-ringR*.12)/(ringR*.25),0,1);
    const c=SP[o.kind];const pulse=o.kind==='lotus'?1+.06*Math.sin(G.t*3+o.rot):1;
    sprite(c,o.x,o.y,o.kind==='lotus'?o.rot*.3:o.rot,pulse,fadeIn*fadeOut);
  }

  // particles
  ctx.globalCompositeOperation='lighter';
  for(const p of G.parts){const a=p.life/p.max;ctx.fillStyle=`rgba(${p.rgb},${a*.9})`;ctx.beginPath();ctx.arc(p.x,p.y,p.size*(.4+a*.6),0,TAU);ctx.fill()}
  for(const r of G.ripples){ctx.strokeStyle=`rgba(${r.rgb},${r.life*.7})`;ctx.lineWidth=r.w*r.life+.5;ctx.beginPath();ctx.arc(cx,cy,r.r,0,TAU);ctx.stroke()}
  ctx.globalCompositeOperation='source-over';

  if(G.nirvana>0)drawNirvana();
  drawPlayer(acc);

  // vignette + flash
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const v=ctx.createRadialGradient(cx,cy,S*.35,cx,cy,Math.hypot(W,H)*.62);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.55)');ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
  if(G.flash>0){const f=ctx.createRadialGradient(cx,cy,S*.1,cx,cy,Math.hypot(W,H)*.6);f.addColorStop(0,`rgba(${G.flashRGB},0)`);f.addColorStop(1,`rgba(${G.flashRGB},${G.flash*.45})`);ctx.fillStyle=f;ctx.fillRect(0,0,W,H)}
}
function drawHub(acc,t,pulse,slow){
  const R=ringR*.24*pulse;ctx.save();ctx.translate(cx,cy);
  ctx.globalCompositeOperation='lighter';
  const gl=ctx.createRadialGradient(0,0,0,0,0,R*2.2);gl.addColorStop(0,`rgba(${acc},.22)`);gl.addColorStop(1,`rgba(${acc},0)`);ctx.fillStyle=gl;ctx.beginPath();ctx.arc(0,0,R*2.2,0,TAU);ctx.fill();
  ctx.globalCompositeOperation='source-over';
  ctx.rotate(t*.25*slow);
  ctx.strokeStyle=`rgba(${acc},.85)`;ctx.fillStyle=`rgba(${acc},.85)`;ctx.lineWidth=Math.max(1.5,R*.06);
  ctx.beginPath();ctx.arc(0,0,R,0,TAU);ctx.stroke();
  ctx.lineWidth=Math.max(1,R*.025);ctx.beginPath();ctx.arc(0,0,R*.88,0,TAU);ctx.stroke();
  for(let i=0;i<8;i++){const a=i*TAU/8;ctx.lineWidth=Math.max(1.2,R*.05);ctx.beginPath();ctx.moveTo(Math.cos(a)*R*.42,Math.sin(a)*R*.42);ctx.lineTo(Math.cos(a)*R,Math.sin(a)*R);ctx.stroke();ctx.beginPath();ctx.arc(Math.cos(a)*R*1.14,Math.sin(a)*R*1.14,R*.07,0,TAU);ctx.fill()}
  ctx.beginPath();ctx.arc(0,0,R*.42,0,TAU);ctx.stroke();
  // the three poisons chasing one another at the hub, as in bhavacakra paintings
  ctx.rotate(-t*1.1*slow);
  const cols=['#ff4b3e','#3fdc84','#1c1636'];
  for(let i=0;i<3;i++){const a=i*TAU/3;ctx.fillStyle=cols[i];ctx.beginPath();ctx.arc(Math.cos(a)*R*.2,Math.sin(a)*R*.2,R*.1,0,TAU);ctx.fill();if(i===2){ctx.strokeStyle='#9d8cf0';ctx.lineWidth=1;ctx.stroke()}}
  ctx.restore();
}
function drawPlayer(acc){
  const[px,py]=playerPos();const fs=G.flameScale*(G.nirvana>0?Math.max(0,1-(NIRV_DUR-G.nirvana)/1.2):1);
  if(G.breath>0){const p=1-G.breath/BREATH_DUR,r=P_R+(objR*5.5-P_R)*ease(p);ctx.strokeStyle=`rgba(${acc},${(1-p)*.9})`;ctx.lineWidth=3*(1-p)+1;ctx.beginPath();ctx.arc(px,py,r,0,TAU);ctx.stroke();ctx.strokeStyle=`rgba(255,255,255,${(1-p)*.4})`;ctx.lineWidth=1;ctx.beginPath();ctx.arc(px,py,r*.8,0,TAU);ctx.stroke()}
  if(fs<=.01)return;
  ctx.globalCompositeOperation='lighter';sprite(SP.glowGold,px,py,0,(.9+.08*Math.sin(G.t*9))*fs,1);ctx.globalCompositeOperation='source-over';
  ctx.save();ctx.translate(px,py);ctx.rotate(G.pa+PI/2);
  const f=P_R*fs*(1+.07*Math.sin(G.t*23)+.05*Math.sin(G.t*37));const sway=Math.sin(G.t*7)*f*.15-G.pv*f*.08;
  const flame=(s,c0,c1)=>{const ff=f*s;const gr=ctx.createRadialGradient(0,-ff*.2,0,0,-ff*.4,ff*2);gr.addColorStop(0,c0);gr.addColorStop(1,c1);ctx.fillStyle=gr;ctx.beginPath();ctx.moveTo(sway*s,-ff*2.3);ctx.quadraticCurveTo(ff*1.15,-ff*.8,ff*.85,0);ctx.arc(0,0,ff*.85,0,PI,false);ctx.quadraticCurveTo(-ff*1.15,-ff*.8,sway*s,-ff*2.3);ctx.fill()};
  flame(1,'#fff3c4','#ff7a1a');flame(.55,'#ffffff','#ffd36e');
  ctx.restore();
  if(G.breathCd>0&&G.mode==='play'){ctx.strokeStyle=`rgba(${acc},.6)`;ctx.lineWidth=2;ctx.beginPath();ctx.arc(px,py,P_R*1.9,-PI/2,-PI/2+TAU*(1-G.breathCd/BREATH_CD));ctx.stroke()}
}
function drawNirvana(){
  const p=1-G.nirvana/NIRV_DUR;const bloom=ease(clamp(p*1.6,0,1));const out=clamp((G.nirvana)/1.2,0,1);
  ctx.save();ctx.globalCompositeOperation='lighter';
  ctx.translate(cx,cy);ctx.rotate(G.t*.1);
  for(let i=0;i<24;i++){ctx.rotate(TAU/24);const gr=ctx.createLinearGradient(0,0,0,-ringR*2.6);gr.addColorStop(0,`rgba(255,230,180,${.12*bloom*out})`);gr.addColorStop(1,'rgba(255,230,180,0)');ctx.fillStyle=gr;ctx.beginPath();ctx.moveTo(-ringR*.04,0);ctx.lineTo(ringR*.04,0);ctx.lineTo(ringR*.18,-ringR*2.6);ctx.lineTo(-ringR*.18,-ringR*2.6);ctx.fill()}
  ctx.restore();
  sprite(SP.bigLotus,cx,cy,G.t*.05,.2+bloom*.9,bloom*out);
}

/* ---------------- modes & input ---------------- */
let touchy=matchMedia('(pointer:coarse)').matches;
function toDemo(){newGame('demo')}
function startPlay(){newGame('play');G.spawnT=1.4;banner('旅程开始',REALMS[0].n,REALMS[0].e,REALMS[0].q,REALMS[0].c);if(Snd.on)Snd.bowl(196,.2,6)}
function activity(){if(G.mode==='play')G.idle=0}

addEventListener('keydown',e=>{
  if(e.target.closest&&e.target.closest('button')&&(e.key===' '||e.key==='Enter'))return;
  if(G.mode==='demo'){if(e.key!=='Tab'&&!e.metaKey&&!e.ctrlKey){startPlay();e.preventDefault()}return}
  activity();
  if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A'){G.keyDir=-1;G.target=null;e.preventDefault()}
  else if(e.key==='ArrowRight'||e.key==='d'||e.key==='D'){G.keyDir=1;G.target=null;e.preventDefault()}
  else if(e.key===' '||e.key==='ArrowUp'||e.key==='w'||e.key==='W'||e.key==='Shift'){breathe();e.preventDefault()}
  else if(e.key==='Escape'){toDemo()}
});
addEventListener('keyup',e=>{
  if(!G)return;
  if((e.key==='ArrowLeft'||e.key==='a'||e.key==='A')&&G.keyDir===-1)G.keyDir=0;
  if((e.key==='ArrowRight'||e.key==='d'||e.key==='D')&&G.keyDir===1)G.keyDir=0;
});
let down=false;
function aimAt(e){G.target=Math.atan2(e.clientY-cy,e.clientX-cx);G.keyDir=0}
cv.addEventListener('pointerdown',e=>{
  if(e.pointerType!=='mouse')touchy=true;
  if(G.mode==='demo'){startPlay();return}
  activity();down=true;aimAt(e);
  if(e.pointerType==='mouse'&&e.button===2)breathe();
});
cv.addEventListener('pointermove',e=>{if(G.mode!=='play')return;if(down||e.pointerType==='mouse'){activity();aimAt(e)}});
addEventListener('pointerup',()=>{down=false});
cv.addEventListener('contextmenu',e=>e.preventDefault());
$('breathe').addEventListener('pointerdown',e=>{e.stopPropagation();activity();breathe()});
$('snd').addEventListener('click',e=>{e.stopPropagation();const on=Snd.toggle();$('snd').setAttribute('aria-pressed',on?'true':'false');$('snd').textContent=on?'声音 开':'声音 关'});
$('snd').addEventListener('pointerdown',e=>e.stopPropagation());

newGame('demo');
resize();
addEventListener('resize',resize);
document.fonts&&document.fonts.ready.then(()=>buildLayers(cur.acc.map(Math.round)));
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(frame)}
requestAnimationFrame(frame);
})();
</script>
